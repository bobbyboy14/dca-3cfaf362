<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bob's Hub</title>
<style>
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#0f1420;color:#e8ecf4;padding:16px}
.w{max-width:520px;margin:0 auto}h1{font-size:20px;margin:0 0 12px}
.buy{background:#16304a;border:1px solid #2d5b8a;border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:17px}
.buy b{color:#ffd84d}
table{width:100%;border-collapse:collapse;background:#171e2e;border-radius:10px;overflow:hidden}
td,th{padding:10px;text-align:left;border-bottom:1px solid #222b40;vertical-align:top;font-size:15px}
th{color:#9aa6bd;font-weight:600;font-size:13px}td.p{white-space:nowrap}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}
.none{background:#1d3b2a;color:#7ee2a0}.watch{background:#4a3b12;color:#ffd166}.alert{background:#4a1616;color:#ff8080}
.n{font-size:13px;color:#c9d1e0;margin-top:4px}
</style></head><body><div class="w">
<h1>Bob's Hub</h1>
<div class="buy" id="buy">This week's buy: …</div>
<table><thead><tr><th>Asset</th><th>Price</th><th>Security</th></tr></thead><tbody id="rows"><tr><td colspan="3">Loading…</td></tr></tbody></table>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=t=>String(t||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const LV={none:["none","Zero threats"],watch:["watch","Watch"],alert:["alert","Alert"]};
const get=u=>fetch(u,{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).catch(()=>null);
(async()=>{
  const t=Date.now();
  const [d,cg,sec,wk]=await Promise.all([get("data.json?t="+t),
    get("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd"),
    get("security.json?t="+t),get("weekly.json?t="+t)]);
  $("buy").innerHTML=wk?"This week's buy: <b>"+esc(wk.pick)+" A$"+Math.ceil(wk.amount_aud)+"</b>":"This week's buy: not available";
  const T=d&&d.today, f2=v=>v.toFixed(2);
  const btc=cg&&cg.bitcoin&&cg.bitcoin.usd?cg.bitcoin.usd:(T?T.BTC.close:null);
  const P={BTC:btc!=null?"US$"+Math.round(btc).toLocaleString("en-AU"):"–",
    TSLA:T?"US$"+f2(T.TSLA.close):"–",MSTR:T?"US$"+f2(T.MSTR.close):"–",SEMI:T?"A$"+f2(T.SEMI.close):"–"};
  $("rows").innerHTML=["BTC","TSLA","MSTR","SEMI"].map(k=>{const a=sec&&sec.assets[k];const L=a?(LV[a.level]||LV.watch):null;
    return "<tr><td><b>"+k+"</b></td><td class='p'>"+P[k]+"</td><td>"+(L?"<span class='pill "+L[0]+"'>"+L[1]+"</span>"+(a.level!=="none"&&a.note?"<div class='n'>"+esc(a.note)+"</div>":""):"–")+"</td></tr>"}).join("");
})();
</script></body></html>
