<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bob's Hub</title>
<style>
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#0f1420;color:#e8ecf4;padding:16px}
.w{max-width:520px;margin:0 auto}h1{font-size:20px;margin:0 0 12px}
.buy{background:#16304a;border:1px solid #2d5b8a;border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:17px}
.buy b{color:#ffd84d}
.tot{background:#171e2e;border-radius:10px;padding:12px 14px;margin-top:12px}.tot .h{font-size:30px;font-weight:800}.tot .h small{font-size:17px;font-weight:600}.tot .s{font-size:13px;color:#9aa6bd;margin-top:4px}.up{color:#7ee2a0}.down{color:#ff8080}
table{width:100%;border-collapse:collapse;background:#171e2e;border-radius:10px;overflow:hidden}
td,th{padding:10px;text-align:left;border-bottom:1px solid #222b40;vertical-align:top;font-size:15px}
th{color:#9aa6bd;font-weight:600;font-size:13px}td.p{white-space:nowrap}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}
.none{background:#1d3b2a;color:#7ee2a0}.watch{background:#4a3b12;color:#ffd166}.alert{background:#4a1616;color:#ff8080}
.du{margin-top:12px;background:#171e2e;border-radius:10px;padding:12px 14px;font-size:14px}.du .d{font-size:12px;color:#9aa6bd}.du .hl{margin:4px 0 6px;font-weight:600}.du div.r{padding:3px 0}.du .t{display:inline-block;width:46px;font-weight:700}.du .m{display:inline-block;width:56px}
.sc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.sc>div{background:#171e2e;border-radius:10px;padding:10px;font-size:12px;color:#c9d1e0}.sc .t{font-size:14px;font-weight:700;color:#e8ecf4}.sc .st{font-weight:700}.sc .amber{color:#ffd166}.sc .l{margin:3px 0;color:#e8ecf4}.sc .q{color:#9aa6bd}
.n{font-size:13px;color:#c9d1e0;margin-top:4px}
</style></head><body><div class="w">
<h1>Bob's Hub</h1>
<div class="buy" id="buy">This week's buy: …</div>
<table><thead><tr><th>Asset</th><th>Price</th><th>Security</th></tr></thead><tbody id="rows"><tr><td colspan="3">Loading…</td></tr></tbody></table>
<div class="sc" id="sc"></div>
<div class="tot" id="tot"><div class="h">…</div></div>
<div class="du" id="du" hidden></div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=t=>String(t||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const LV={none:["none","Zero threats"],watch:["watch","Watch"],alert:["alert","Alert"]};
const get=u=>fetch(u,{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).catch(()=>null);
(async()=>{
  const t=Date.now();
  const [d,cg,sec,wk,mk]=await Promise.all([get("data.json?t="+t),
    get("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=aud,usd"),
    get("security.json?t="+t),get("weekly.json?t="+t),get("market.json?t="+t)]);
  if(mk&&mk.scores){const C={"On track":"up","Mixed":"amber","Off track":"down"};
    $("sc").innerHTML=["BTC","TSLA","MSTR","SEMI"].filter(k=>mk.scores[k]).map(k=>{const x=mk.scores[k];return "<div><div class='t'>"+k+" <span class='st "+(C[x.status]||"")+"'>"+esc(x.status)+"</span> "+x.score+"/10</div><div class='l'>"+esc(x.line)+"</div>"+Object.values(x.parts||{}).map(v=>"<div class='q'>"+esc(v)+"</div>").join("")+"</div>"}).join("");}
  if(mk){const u=new Date(mk.updated).toLocaleString("en-AU",{timeZone:"Australia/Melbourne",weekday:"short",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});
    $("du").innerHTML="<div class='d'>Daily update · "+u+" AEDT</div><div class='hl'>"+esc(mk.headline)+"</div>"+["BTC","TSLA","MSTR","SEMI"].filter(k=>mk.assets[k]).map(k=>{const x=mk.assets[k];return "<div class='r'><span class='t'>"+k+"</span><span class='m "+(String(x.move).startsWith("-")?"down":"up")+"'>"+esc(x.move)+"</span>"+esc(x.note)+"</div>"}).join("");$("du").hidden=false;}
  $("buy").innerHTML=wk?"This week's buy: <b>"+esc(wk.pick)+" A$"+Math.ceil(wk.amount_aud)+"</b>":"This week's buy: not available";
  const COST={BTC:{units:0.1336,cost:16500},TSLA:{units:41,cost:25595},MSTR:{units:21.56,cost:4990}};
  const V=d&&d.value_inputs,A=n=>"A$"+Math.round(Math.abs(n)).toLocaleString("en-AU");
  if(V){let val=0,inn=0;for(const k in COST){const p=k==="BTC"&&cg&&cg.bitcoin&&cg.bitcoin.aud?cg.bitcoin.aud:V[k].price_aud;val+=COST[k].units*p;inn+=COST[k].cost;}
    const g=val-inn,c=g>=0?"up":"down",s=g>=0?"+":"-";
    $("tot").innerHTML="<div class='h "+c+"'>"+s+A(g)+" <small>("+s+Math.abs(g/inn*100).toFixed(1)+"%)</small></div><div class='s'>Value "+A(val)+" · Put in "+A(inn)+"</div>";}
  else $("tot").innerHTML="<div class='h'>–</div>";
  const T=d&&d.today, f2=v=>v.toFixed(2);
  const btc=cg&&cg.bitcoin&&cg.bitcoin.usd?cg.bitcoin.usd:(T?T.BTC.close:null);
  const P={BTC:btc!=null?"US$"+Math.round(btc).toLocaleString("en-AU"):"–",
    TSLA:T?"US$"+f2(T.TSLA.close):"–",MSTR:T?"US$"+f2(T.MSTR.close):"–",SEMI:T?"A$"+f2(T.SEMI.close):"–"};
  $("rows").innerHTML=["BTC","TSLA","MSTR","SEMI"].map(k=>{const a=sec&&sec.assets[k];const L=a?(LV[a.level]||LV.watch):null;
    return "<tr><td><b>"+k+"</b></td><td class='p'>"+P[k]+"</td><td>"+(L?"<span class='pill "+L[0]+"'>"+L[1]+"</span>"+(a.level!=="none"&&a.note?"<div class='n'>"+esc(a.note)+"</div>":""):"–")+"</td></tr>"}).join("");
})();
</script></body></html>
