<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bob's Hub</title>
<style>
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#0f1420;color:#e8ecf4;padding:16px}
.w{max-width:520px;margin:0 auto}h1{font-size:20px;margin:0 0 12px}
.buy{margin-top:0;background:#16304a;border:1px solid #2d5b8a;border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:17px}
.buy b{color:#ffd84d}
.tot{background:#171e2e;border-radius:10px;padding:12px 14px}.tot .r{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0;font-size:15px}.tot .r span:first-child{color:#9aa6bd}.tot .h{font-size:26px;font-weight:800}.tot .h small{font-size:17px;font-weight:600}.tot .s{font-size:13px;color:#9aa6bd;margin-top:4px}.up{color:#7ee2a0}.down{color:#ff8080}
table{width:100%;border-collapse:collapse;background:#171e2e;border-radius:10px;overflow:hidden}
td,th{padding:10px;text-align:left;border-bottom:1px solid #222b40;vertical-align:top;font-size:15px}
th{color:#9aa6bd;font-weight:600;font-size:13px}td.p{white-space:nowrap}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}
.none{background:#1d3b2a;color:#7ee2a0}.watch{background:#4a3b12;color:#ffd166}.alert{background:#4a1616;color:#ff8080}
.du{margin-top:12px;background:#171e2e;border-radius:10px;padding:12px 14px;font-size:14px}.du .d{font-size:12px;color:#9aa6bd}.du .hl{margin:4px 0 6px;font-weight:600}.du div.r{padding:3px 0}.du .t{display:inline-block;width:46px;font-weight:700}.du .m{display:inline-block;width:56px}
.sc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.sc>div{background:#171e2e;border-radius:10px;padding:10px;font-size:12px;color:#c9d1e0}.sc .t{font-size:14px;font-weight:700;color:#e8ecf4}.sc .st{font-weight:700}.sc .amber{color:#ffd166}.sc .l{margin:3px 0;color:#e8ecf4}.sc .q{color:#9aa6bd}
h2{font-size:14px;font-weight:700;color:#9aa6bd;margin:16px 0 6px;text-transform:none}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}nav.tabs a{flex:0 1 auto;padding:7px 11px;border-radius:16px;background:#171e2e;color:#c9d1e0;text-decoration:none;font-size:13px;font-weight:600;line-height:1.25}nav.tabs a.on{background:#2d5b8a;color:#fff}
.muted{font-size:12px;color:#9aa6bd}h3{font-size:15px;margin:18px 0 6px}a{color:#6ea8ff}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stats>div{background:#171e2e;border-radius:10px;padding:10px}.stats .k{font-size:12px;color:#9aa6bd}.stats .v{font-size:18px;font-weight:700;margin-top:2px}.stats small{font-size:13px}
.tw{overflow-x:auto;margin-top:10px}.tw td,.tw th{font-size:13px;padding:7px 8px}tr.tot td{border-top:2px solid #2d5b8a}
.cbox{position:relative;height:240px;margin-top:10px;background:#171e2e;border-radius:10px;padding:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.seg button{flex:1;min-width:56px;padding:9px;border:0;border-radius:8px;background:#171e2e;color:#e8ecf4;font-weight:600;font-size:14px}.seg button.on{background:#2d5b8a}
.amts{display:grid;grid-template-columns:1fr 1fr;gap:6px}.am{display:flex;align-items:center;gap:6px;background:#171e2e;border-radius:8px;padding:6px 8px;font-weight:700;font-size:14px}
input[type=number],select{width:100%;min-width:0;padding:8px;border-radius:6px;border:1px solid #2a3550;background:#0f1420;color:#e8ecf4;font-size:15px}.am input[type=checkbox],.ck input{width:20px;height:20px}
.row2{display:flex;gap:8px;margin-top:8px;align-items:end}.row2 label{flex:2;font-size:13px;color:#9aa6bd}.row2 select{flex:1}.ck{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:14px}
.chip{display:inline-block;padding:2px 7px;border-radius:9px;font-size:11px;font-weight:700;white-space:nowrap}.chip.g{background:#1d3b2a;color:#7ee2a0}.chip.m{background:#4a3b12;color:#ffd166}.chip.b{background:#4a1616;color:#ff8080}.chip.nv{background:#26304a;color:#c9d1e0}
.ov{background:#171e2e;border-radius:10px;padding:10px 12px;margin-top:10px}.hl{display:flex;flex-direction:column;gap:6px;margin-top:8px}.h1{background:#171e2e;border-radius:10px;padding:9px 11px}.h1 summary{list-style:none;cursor:pointer}.h1 summary::-webkit-details-marker{display:none}
.h1 .top{display:flex;align-items:center;gap:6px}.wt{margin-left:auto;color:#9aa6bd;font-size:13px}.dd{margin-top:8px;font-size:13px;display:flex;flex-direction:column;gap:5px;border-top:1px solid #222b40;padding-top:8px}
.callout{border-radius:10px;padding:10px 12px;font-size:14px;margin:6px 0}.callout.b{background:#3a1a1a}.callout.m{background:#3a3014}.callout.g{background:#173022}.callout.nv{background:#1b2740}
.rws{display:flex;flex-direction:column;gap:6px}.rw{display:flex;gap:8px;justify-content:space-between;align-items:flex-start;background:#171e2e;border-radius:8px;padding:8px 10px;font-size:14px}
.bars{display:flex;flex-direction:column;gap:5px}.bar{display:flex;align-items:center;gap:6px;font-size:13px}.bl{width:118px;color:#c9d1e0}.bt{flex:1;background:#171e2e;border-radius:4px;height:12px}.bt i{display:block;height:100%;background:#4da3ff;border-radius:4px}.bt i.neg{background:#ff6b6b}.bv{width:52px;text-align:right}
.pc{display:grid;grid-template-columns:1fr;gap:6px}ol.n,ul.n{padding-left:20px}ol.n li,ul.n li{margin:4px 0}
.r1{display:flex;flex-wrap:wrap;gap:0 10px}.r1>div{flex:1 1 230px;min-width:0;display:flex;flex-direction:column}.r1 .tot,.r1 .buy{flex:1;margin-bottom:0}.r1 .tot .h{font-size:20px}.r1 .tot .h small{font-size:14px}.tot .r span{white-space:nowrap}.tot .r{gap:8px}
.n{font-size:13px;color:#c9d1e0;margin-top:4px}
#tab-hub h2{margin:28px 0 10px}#tab-hub .r1{gap:0 20px}#tab-hub .sc{gap:14px;margin-top:0}#tab-hub .sc>div{padding:14px}#tab-hub .tot,#tab-hub .buy,#tab-hub .du{padding:16px 18px}#tab-hub .du{margin-top:0}#tab-hub td,#tab-hub th{padding:12px}
#tab-hub .tot,#tab-hub .buy{box-sizing:border-box;min-width:0;overflow-wrap:anywhere}#tab-hub .tot .h{text-align:right;line-height:1.15}#tab-hub .tot .h small{display:block;font-size:13px}#tab-hub .sc .nd{font-size:12px;margin-top:5px;font-weight:600}#tab-hub .sc .amber,.nd.amber{color:#ffd166}
tr.need td{font-size:12px;color:#c9d1e0;padding-top:0;border-bottom:1px solid #2a3550}.amber{color:#ffd166}
#tab-hub .sc .yt{display:block;font-size:12px;margin-top:6px;color:#9aa6bd}#tab-hub .yt input{width:52px;padding:2px 4px;font:inherit;background:#0f1626;color:inherit;border:1px solid #2a3550;border-radius:4px}#tab-hub .sc .bt{font-size:12px;margin-top:2px;font-weight:600}
#tab-hub .sc .gr{font-size:13px;font-weight:600;margin-top:4px}#tab-hub .sc .sv{font-size:18px;font-weight:700;margin-top:2px}#tab-hub .sc .sv .st{font-size:14px}#tab-hub .sc .bd{font-size:11px;color:#9aa6bd;margin-top:2px}
.box{background:#171e2e;border-radius:10px;padding:16px 18px}table.parts{width:100%;border-collapse:collapse;margin-top:12px}table.parts td,table.parts th{padding:10px;vertical-align:top;text-align:left;border-bottom:1px solid #2a3550;font-size:13px}table.parts td:first-child{white-space:nowrap}.gd{margin-top:6px;font-size:12px;color:#9aa6bd}ul.src{padding-left:18px;font-size:13px}ul.src a{color:#8ab4ff;overflow-wrap:anywhere}
</style></head><body><div class="w">
<h1>Bob's Hub</h1>
<nav class="tabs"><a href="#hub" data-t="hub">Hub</a><a href="#cagr" data-t="cagr">CAGR</a><a href="#tsla-score" data-t="tsla-score">Tesla Scorecard</a><a href="#btc-score" data-t="btc-score">Bitcoin Scorecard</a><a href="#mstr-score" data-t="mstr-score">MSTR Scorecard</a><a href="#scorecard" data-t="scorecard">SEMI Scorecard</a></nav>
<div id="tab-hub">
<div class="r1"><div><h2>Portfolio</h2>
<div class="tot" id="tot"><div class="h">…</div></div></div>
<div><h2>This Week's Buy</h2>
<div class="buy" id="buy">…</div></div></div>
<h2>Trajectory</h2>
<div class="sc" id="sc"></div>
<h2>Security</h2>
<table><thead><tr><th>Asset</th><th>Price</th><th>Security</th></tr></thead><tbody id="rows"><tr><td colspan="3">Loading…</td></tr></tbody></table>
<h2 id="duh" hidden>Daily Update</h2>
<div class="du" id="du" hidden></div>
</div>
<div id="tab-cagr" hidden></div><div id="tab-scorecard" hidden></div><div id="tab-tsla-score" hidden></div><div id="tab-btc-score" hidden></div><div id="tab-mstr-score" hidden></div>
</div>
<script>
function ytG(k){try{const s=localStorage.getItem("hubYT_"+k);if(s!==null&&s!=="")return s}catch(e){}return "25"}
function ytU(){document.querySelectorAll("#sc input[data-k]").forEach(i=>{const k=i.dataset.k,e=document.querySelector("#sc .bt[data-k='"+k+"']");let v=parseFloat(i.value);if(!isFinite(v))v=25;try{localStorage.setItem("hubYT_"+k,i.value)}catch(x){}const b=+e.dataset.r*100>=v;e.className="bt "+(b?"up":"down");e.textContent=(b?"Beating ":"Short of ")+v+"%"})}
document.addEventListener("input",e=>{if(e.target.matches&&e.target.matches("#sc input[data-k]"))ytU()});

const $=id=>document.getElementById(id);
const esc=t=>String(t||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const LV={none:["none","Zero threats"],watch:["watch","Watch"],alert:["alert","Alert"]};
const get=u=>fetch(u,{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).catch(()=>null);
(async()=>{
  const t=Date.now();
  const [d,cg,sec,wk,mk]=await Promise.all([get("data.json?t="+t),
    get("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=aud,usd"),
    get("security.json?t="+t),get("weekly.json?t="+t),get("market.json?t="+t)]);
  if(mk&&mk.scores){const C={"On track":"up","Mixed":"amber","Behind":"down"},N=(mk.needed&&mk.needed.assets)||{},NC={"On track":"up","Stretch":"amber","Behind":"down"};
    $("sc").innerHTML=["BTC","TSLA","MSTR","SEMI"].filter(k=>mk.scores[k]).map(k=>{const x=mk.scores[k];const P=x.points||{},g=Number(x.score),G=isNaN(g)?null:g>=7?["On track","up"]:g>=6?["Mixed","amber"]:["Behind","down"];return "<div><div class='t'>"+k+"</div>"+(G?"<div class='gr "+G[1]+"'>Growth: "+G[0]+"</div>":"")+"<div class='sv'>"+"<span class='st "+(G?G[1]:(C[x.status]||""))+"' title='"+esc(G?G[0]:x.status)+"'>"+x.score+"/10</span>"+"</div>"+(N[k]?"<label class='yt'>CAGR yearly target <input type='number' min='0' max='500' step='1' inputmode='numeric' data-k='"+k+"' value='"+ytG(k)+"'>%</label><div class='bt' data-k='"+k+"' data-r='"+N[k].recent+"'></div>":"")+"</div>"}).join("");ytU();}
  if(mk){const u=new Date(mk.updated).toLocaleString("en-AU",{timeZone:"Australia/Melbourne",weekday:"short",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});
    $("du").innerHTML="<div class='d'>"+u+" AEDT</div><div class='hl'>"+esc(mk.headline)+"</div>"+["BTC","TSLA","MSTR","SEMI"].filter(k=>mk.assets[k]).map(k=>{const x=mk.assets[k];return "<div class='r'><span class='t'>"+k+"</span><span class='m "+(String(x.move).startsWith("-")?"down":"up")+"'>"+esc(x.move)+"</span>"+esc(x.note)+"</div>"}).join("");$("du").hidden=false;$("duh").hidden=false;}
  $("buy").innerHTML=wk?"<b>"+esc(wk.pick)+"</b><div style='margin-top:10px'><b>A$"+Math.ceil(wk.amount_aud)+"</b></div>":"Not available";
  const COST={BTC:{units:0.1336,cost:16500},TSLA:{units:41,cost:25595},MSTR:{units:21.56,cost:4990}};
  const V=d&&d.value_inputs,A=n=>"A$"+Math.round(Math.abs(n)).toLocaleString("en-AU");
  if(V){let val=0,inn=0;for(const k in COST){const p=k==="BTC"&&cg&&cg.bitcoin&&cg.bitcoin.aud?cg.bitcoin.aud:V[k].price_aud;val+=COST[k].units*p;inn+=COST[k].cost;}
    const g=val-inn,c=g>=0?"up":"down",s=g>=0?"+":"-";
    $("tot").innerHTML="<div class='r'><span>Invested</span><span>"+A(inn)+"</span></div><div class='r'><span>Portfolio Value</span><span>"+A(val)+"</span></div><div class='r'><span>Up / Down</span><span class='h "+c+"'>"+s+A(g)+"<small>"+s+Math.abs(g/inn*100).toFixed(1)+"%</small></span></div>";}
  else $("tot").innerHTML="<div class='h'>–</div>";
  const T=d&&d.today, f2=v=>v.toFixed(2);
  const btc=cg&&cg.bitcoin&&cg.bitcoin.usd?cg.bitcoin.usd:(T?T.BTC.close:null);
  const P={BTC:btc!=null?"US$"+Math.round(btc).toLocaleString("en-AU"):"–",
    TSLA:T?"US$"+f2(T.TSLA.close):"–",MSTR:T?"US$"+f2(T.MSTR.close):"–",SEMI:T?"A$"+f2(T.SEMI.close):"–"};
  $("rows").innerHTML=["BTC","TSLA","MSTR","SEMI"].map(k=>{const a=sec&&sec.assets[k];const L=a?(LV[a.level]||LV.watch):null;
    return "<tr><td><b>"+k+"</b></td><td class='p'>"+P[k]+"</td><td>"+(L?"<span class='pill "+L[0]+"'>"+L[1]+"</span>"+(a.level!=="none"&&a.note?"<div class='n'>"+esc(a.note)+"</div>":""):"–")+"</td></tr>"}).join("");
})();
</script>
<script>
(function(){const TABS=["hub","cagr","scorecard","tsla-score","btc-score","mstr-score"];let lib=null;
const need=()=>lib||(lib=new Promise((ok,no)=>{const s=document.createElement("script");s.src="tabs.js?v=12";s.onload=ok;s.onerror=no;document.head.appendChild(s);}));
async function go(){if(location.hash==="#semireview"){history.replaceState(null,"","#scorecard");}const t=TABS.includes(location.hash.slice(1))?location.hash.slice(1):"hub";
 TABS.forEach(k=>{document.getElementById("tab-"+k).hidden=k!==t;});
 document.querySelectorAll("nav.tabs a").forEach(a=>a.classList.toggle("on",a.dataset.t===t));
 if(t!=="hub"){try{await need();await HubTabs[t]();}catch(e){document.getElementById("tab-"+t).innerHTML="<div class='muted'>Couldn't load ("+(e.message||e)+"). Pull to refresh.</div>";}}}
addEventListener("hashchange",go);go();})();
</script></body></html>
