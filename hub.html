  const countRecoup=root=>{if(!root||!root.querySelectorAll)return;const reduce=typeof matchMedia==="function"&&matchMedia("(prefers-reduced-motion: reduce)").matches;root.querySelectorAll(".num").forEach(el=>{const final=el.getAttribute("data-final");if(reduce||typeof requestAnimationFrame!=="function"){el.textContent=final;return;}const n=+el.getAttribute("data-n"),dec=+el.getAttribute("data-d")||0,pre=el.getAttribute("data-p")||"",t0=performance.now();const step=now=>{const u=Math.min(1,(now-t0)/800),e=1-Math.pow(1-u,3),v=n*e;el.textContent=pre+(dec?v.toFixed(dec):Math.round(v).toLocaleString("en-AU"));if(u<1)requestAnimationFrame(step);else el.textContent=final;};requestAnimationFrame(step);});};
