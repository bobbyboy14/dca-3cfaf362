name: Update growth data
on:
  schedule:
    - cron: "*/30 * * * 1-5"   # every 30 min on weekdays (UTC)
    - cron: "15 22 * * *"      # daily (about 9:15am Melbourne)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet yfinance
      - run: python scripts/fetch_data.py
      - run: python scripts/fetch_holdings.py || echo 'holdings fetch failed'
      - name: Commit data.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json holdings.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Update growth data.json"
          git pull --rebase origin main
          git push
